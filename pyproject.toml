[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "system1-ops"
version = "0.3.0"
description = "Portable Jev inference services and operations for Laya and StartLux"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "psutil>=5.9,<8",
]

[project.scripts]
system1 = "system1_ops.manage:main"
system1-benchmark = "system1_ops.benchmark:main"
system1-bootstrap = "system1_ops.bootstrap:main"

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "coverage>=7,<8",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "types-PyYAML",
    "types-psutil",
    "clang-format>=20,<23",
    "hatchling>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/system1_ops"]

[tool.ruff]
line-length = 120
cache-dir = ".local/ruff-cache"
extend-exclude = [".local", "vendor", "models", "evidence", "reports", ".native-build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".local/pytest-cache"
pythonpath = ["src"]

[tool.coverage.run]
source = ["system1_ops"]
data_file = ".local/coverage"
branch = true
omit = ["*/verify_real.py", "*/verify_native.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
cache_dir = ".local/mypy-cache"
files = ["src/system1_ops"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
