name: Cross-platform API and operations
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-http.txt httpx ruff
      - run: python -m unittest test_ops test_extended
      - run: ruff check . --select E9,F63,F7,F82,F401,F811 --line-length 120
      - run: python -m compileall -q .
