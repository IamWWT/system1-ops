<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System 1 · 运维台</title>
<style>
:root{color-scheme:dark;--bg:#0c1118;--card:#141d28;--border:#273444;--muted:#9aaec2;--accent:#6cddd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e7eff9;font:14px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:28px;margin:0}h2{font-size:17px;margin:0 0 14px}p{color:var(--muted);margin:5px 0 20px}.badge{color:var(--accent);font:12px monospace;letter-spacing:2px}.auth{display:flex;gap:8px}input,select,textarea,button{font:inherit;border:1px solid var(--border);border-radius:7px;background:#0e1722;color:#e7eff9;padding:9px 12px}button{cursor:pointer;background:#203246}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.primary{background:#25534e}.danger{color:#ffa7a7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}.card dl{display:grid;grid-template-columns:1fr 1fr;margin:10px 0}.card dt{color:var(--muted)}.card dd{margin:0;text-align:right;font-family:monospace}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:5px 9px}.status{font-size:12px;color:var(--muted)}.ok{color:var(--accent)}.fail{color:#ffa7a7}.hardware{display:flex;gap:30px;flex-wrap:wrap;padding:14px 20px;border:1px solid var(--border);border-radius:9px;background:#101923}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}textarea{width:100%;height:245px;resize:vertical;font:12px/1.5 monospace}pre{white-space:pre-wrap;overflow:auto;word-break:break-word;background:#091019;padding:15px;border-radius:8px;font:12px/1.5 monospace;max-height:420px;margin:0}.panel{margin-bottom:16px}#notice{margin:12px 0;min-height:24px;color:var(--muted)}table{width:100%;border-collapse:collapse;font:12px monospace}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--border)}details{margin-top:12px}summary{cursor:pointer;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin-top:24px}@media(max-width:850px){.grid,.columns{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{padding:18px}.auth{width:100%}.auth input{min-width:0;flex:1}}
</style></head><body><main>
<header><div><div class="badge">LOCAL DECISION OPERATIONS</div><h1>System 1 运维台</h1><p>模型状态 · 资源观察 · Jev 请求调试</p></div><div class="auth"><input id="key" type="password" autocomplete="off" placeholder="管理密钥（仅当前标签页）" aria-label="管理密钥"><button id="connect">连接</button></div></header>
<div class="hardware" id="hardware">等待硬件信息…</div><div id="notice" role="status"></div><section class="grid" id="models"></section>
<div class="columns"><section class="panel"><div class="toolbar"><h2>请求调试</h2><select id="debugModel" aria-label="调试模型"></select><button class="primary" id="send">发送 /v1/systemone</button></div><textarea id="request" spellcheck="false" aria-label="JSON 请求"></textarea><p id="debugMeta"></p><pre id="response">等待请求</pre></section>
<section class="panel"><div class="toolbar"><h2>运行日志</h2><select id="logModel" aria-label="日志模型"></select><button id="refreshLogs">刷新</button><label><input id="live" type="checkbox" checked>自动更新</label></div><pre id="logs">等待日志</pre></section></div>
<section class="panel"><div class="toolbar"><h2>性能测试结果</h2><button id="refreshReports">刷新</button></div><p>每个候选独立进程测试，先通过概率兼容检查再参与推荐。GPU / Windows 未测试时会明确标注。</p><div id="reports"></div></section>
<footer>端口 8882–8884：Jev 模型 API · 8885：运维台。修改配置后重启生效。未设置 SYSTEM1_ADMIN_KEY 时页面只读，已配置时须输入密钥。</footer>
</main><script src="/app.js"></script></body></html>
